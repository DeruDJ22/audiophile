name: kuroakai_audio
description: "KuroakaiAudio - High-Fidelity Audiophile Music Player with Bit-Perfect WASAPI/Oboe C++ Audio Engine."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # FFI & Native Interop
  ffi: ^2.1.2
  
  # Local File Browsing & Device Access
  file_picker: ^8.1.7
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  
  # OS Integration & File Association
  app_links: ^6.3.2

  # Persistent Storage
  shared_preferences: ^2.3.2

  # UI Design Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # HTTP & Networking
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # Dynamic Gradient from Album Art
  palette_generator: ^0.3.3+4

  # Environment Config (API Keys)
  flutter_dotenv: ^5.2.1

  # External Links
  url_launcher: ^6.3.1
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - .env
