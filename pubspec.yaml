name: kuroakai_audio
description: "KuroakaiAudio - High-Fidelity Audiophile Music Player with Bit-Perfect WASAPI/Oboe C++ Audio Engine."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # FFI & Native Interop
  ffi: ^2.1.2
  
  # Local File Browsing & Device Access
  file_picker: ^8.1.7
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  
  # OS Integration & File Association
  app_links: ^6.3.2

  # UI Design Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
